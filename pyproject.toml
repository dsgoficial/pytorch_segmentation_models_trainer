[project]
name = "pytorch_segmentation_models_trainer"
version = "1.4.0"
description = "Image segmentation models training of popular architectures."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philipe Borba", email = "philipeborba@gmail.com" }
]
license = { text = "GPL" }
keywords = ["pytorch", "hydra", "semantic-segmentation", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning>=2.4.0",
    "torchmetrics",
    "segmentation-models-pytorch",
    "hydra-core>=1.3.0",
    "kornia",
    "albumentations>=1.4.0",
    "pandas",
    "tensorboardx",
    "pillow",
    "matplotlib",
    "scipy",
    "numpy",
    "pytorch-toolbelt==0.4.3",
    "descartes==1.1.0",
    "pyogrio>=0.7.2",
    "psycopg2-binary",
    "shapely>=2.0.0",
    "geopandas>=1.1.0",
    "geoalchemy2>=0.13.0",
    "rasterio",
    "numba",
    "sahi>=0.10.4",
    "skan>=0.11.0",
    "tqdm",
    "rtree==1.0.0",
    "bidict==0.21.2",
    "cython>=3.0.0",
    "ninja>=1.11.0",
    "click>=8.0.0",
    "ruamel.yaml>=0.18.0",
    "pyyaml>=5.4",
    "pycocotools",
    "multiprocess==0.70.19",
    "wget==3.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.23.0",
    "pydantic-settings>=2.0.0",
    "similaritymeasures==1.4.0",
    "colorama==0.4.5",
    "swifter==1.0.9",
    "python-multipart==0.0.31",
    "seaborn==0.13.2",
    "h3>=3.7.0,<5",
    "scikit-learn>=1.3.2",
    "scikit-image>=0.21.0",
    "typing-extensions>=4.0.0",
    "opencv-python-headless",
    "optuna>=3.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "parameterized",
    "coverage",
    "pytest-timeout",
    "flake8",
    "pytest-xdist",
    "pytest-cov",
]
transformers = [
    "transformers>=4.30.0",
    "peft>=0.6.0",
    "timm>=0.9.0",
]
gee = [
    "earthengine-api>=0.1.370",
]
gpu-ml = [
    "cupy-cuda12x>=12.0.0",
    "cucim-cu12>=23.0.0",
    "cuml-cu12>=23.0.0",
    "pydensecrf",
    "pygco",
]
all = [
    "pytorch_segmentation_models_trainer[tests,transformers,gee]",
]

[project.scripts]
pytorch-smt = "pytorch_segmentation_models_trainer.main:entry"
pytorch-smt-tools = "pytorch_segmentation_models_trainer.tools.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytorch_segmentation_models_trainer"]

[tool.uv]
managed = true
# Pin gpu-ml packages to versions with pre-built wheels or provide stub metadata
# so uv can lock them without GPU hardware. Real installation still requires CUDA.
constraint-dependencies = [
    "cuml-cu12==26.4.0",
    "cucim-cu12==26.4.0",
    "cupy-cuda12x==14.0.1",
    "pydensecrf==1.0rc3",
    "pygco==0.0.1",
]

# cucim-cu12, pydensecrf and pygco are source-only packages that cannot be
# compiled in CI (no CUDA / Cython-3 incompatible). Provide stub metadata so
# uv can produce a consistent lock file without building them.
[[tool.uv.dependency-metadata]]
name = "cucim-cu12"
version = "26.4.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "pydensecrf"
version = "1.0rc3"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "pygco"
version = "0.0.1"
requires-dist = []

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "flake8",
]
