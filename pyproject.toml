[project]
name = "pytorch_segmentation_models_trainer"
version = "1.0.1"
description = "Image segmentation models training of popular architectures."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philipe Borba", email = "philipeborba@gmail.com" }
]
license = { text = "GPL" }
keywords = ["pytorch", "hydra", "semantic-segmentation", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning>=2.4.0",
    "torchmetrics",
    "segmentation-models-pytorch",
    "hydra-core>=1.3.0",
    "kornia",
    "albumentations>=1.4.0",
    "pandas",
    "tensorboardx",
    "pillow",
    "matplotlib",
    "scipy",
    "numpy",
    "pytorch-toolbelt==0.4.3",
    "descartes==1.1.0",
    "pyogrio>=0.7.2",
    "psycopg2-binary",
    "shapely>=2.0.0",
    "geopandas>=1.1.0",
    "geoalchemy2>=0.13.0",
    "rasterio",
    "numba",
    "sahi>=0.10.4",
    "skan>=0.11.0",
    "tqdm",
    "rtree==1.0.0",
    "bidict==0.21.2",
    "cython>=3.0.0",
    "ninja>=1.11.0",
    "pyyaml>=5.4",
    "pycocotools",
    "multiprocess==0.70.13",
    "wget==3.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.23.0",
    "pydantic-settings>=2.0.0",
    "similaritymeasures==0.4.4",
    "colorama==0.4.5",
    "swifter==1.0.9",
    "python-multipart==0.0.5",
    "seaborn==0.13.2",
    "scikit-learn>=1.3.2",
    "scikit-image>=0.21.0",
    "typing-extensions>=4.0.0",
    "opencv-python-headless",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "parameterized",
    "coverage",
    "pytest-timeout",
    "flake8",
]
transformers = [
    "transformers>=4.30.0",
    "peft>=0.6.0",
    "timm>=0.9.0",
]
all = [
    "pytorch_segmentation_models_trainer[tests,transformers]",
]

[project.scripts]
pytorch-smt = "pytorch_segmentation_models_trainer.main:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytorch_segmentation_models_trainer"]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest",
    "coverage",
    "flake8",
]
