# ──────────────────────────────────────────────────────────────────────────────
# Example: CSV Windowed Image Dataset (CSVWindowedImageDataset)
# ──────────────────────────────────────────────────────────────────────────────
# Uses CSVWindowedImageDataset to read specific patches from large images
# without masks. Ideal for unsupervised learning or inference.
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - _self_

backbone:
  name: resnet34
  input_width: 256
  input_height: 256

hyperparameters:
  model_name: unsupervised_resnet34
  batch_size: 32
  epochs: 10
  max_lr: 1e-3

# This is a dummy example for dataset configuration.
# In a real unsupervised task, the model would be an Autoencoder or similar.

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.image_dataset.CSVWindowedImageDataset
  input_csv_path: /data/unlabeled_patches.csv
  image_key: image
  row_off_key: row_off
  col_off_key: col_off
  patch_size_key: patch_size
  image_dtype: uint8
  use_rasterio: true
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.RandomBrightnessContrast
      p: 0.2
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: true
    pin_memory: true
