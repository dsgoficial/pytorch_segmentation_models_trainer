# ──────────────────────────────────────────────────────────────────────────────
# Example: Evidential Deep Learning — training from scratch
#
# Use this config when you have NO pre-trained weights.
# The model is trained end-to-end with KL annealing only:
#   - Epochs 0-9 : only MSE loss (KL weight = 0.0)
#   - Epochs 10-39: MSE + KL annealing from 0.0 to 1.0
#   - Epoch 40+  : full EDL loss (MSE + KL, λ = 1.0)
#
# Key differences from edl_finetune.yaml:
#   freeze_encoder: false  → encoder trains from epoch 0
#   encoder_weights: null  → no pre-trained weights
#   longer epoch schedule  → more time to learn classes before KL kicks in
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - _self_

backbone:
  name: resnet50
  input_width: 512
  input_height: 512

hyperparameters:
  model_name: edl_unet_resnet50_scratch
  batch_size: 8
  epochs: 100
  max_lr: 1.0e-3
  classes: 5   # <-- set to your number of classes

# ── Model ──────────────────────────────────────────────────────────────────
# EvidentialWrapper wraps any model that returns [B, K, H, W] logits.
# It replaces Softmax with Softplus and adds Dirichlet parameterisation.
model:
  _target_: pytorch_segmentation_models_trainer.custom_models.edl_wrapper.EvidentialWrapper
  freeze_encoder: false   # no pre-trained weights → train everything together
  model:
    _target_: segmentation_models_pytorch.Unet
    encoder_name: ${backbone.name}
    encoder_weights: null  # training from scratch
    in_channels: 3
    classes: ${hyperparameters.classes}

# ── Loss ───────────────────────────────────────────────────────────────────
# Two-component compound loss with epoch-based KL annealing.
# EvidentialMSELoss: constant weight 1.0 throughout training.
# EvidentialKLLoss : weight 0 at start, linearly annealed to 1.0 at epoch 40.
loss_params:
  compound_loss:
    epoch_thresholds: [0, 10, 40, 100]
    losses:
      - loss:
          _target_: pytorch_segmentation_models_trainer.custom_losses.edl_loss.EvidentialMSELoss
          name: edl_mse
          num_classes: ${hyperparameters.classes}
        weight: 1.0
      - loss:
          _target_: pytorch_segmentation_models_trainer.custom_losses.edl_loss.EvidentialKLLoss
          name: edl_kl
          num_classes: ${hyperparameters.classes}
        weight: [0.0, 0.0, 1.0, 1.0]  # annealed via epoch_thresholds

# ── Optimizer & Scheduler ──────────────────────────────────────────────────
optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.max_lr}
  weight_decay: 1.0e-4

scheduler_list:
  - scheduler:
      _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      T_max: ${hyperparameters.epochs}
      eta_min: 1.0e-7
    interval: epoch
    frequency: 1

# ── Callbacks ──────────────────────────────────────────────────────────────
callbacks:
  # EvidentialWarmupCallback with freeze_encoder=false does NOT freeze the
  # encoder. It simply logs the training phase for diagnostics.
  - _target_: pytorch_segmentation_models_trainer.custom_callbacks.edl_callbacks.EvidentialWarmupCallback
    warmup_epochs: 0       # no encoder warm-up when training from scratch
    freeze_encoder: false
    partial_unfreeze_epoch: 0

  # Logs a 4-column diagnostic grid every 10 epochs to TensorBoard/WandB.
  # Columns: [input image | predicted class | uncertainty map | ground truth]
  - _target_: pytorch_segmentation_models_trainer.custom_callbacks.edl_callbacks.EvidentialUncertaintyVisualizationCallback
    num_images: 4
    log_every_n_epochs: 10
    norm_params:
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]

# ── Trainer ────────────────────────────────────────────────────────────────
pl_trainer:
  max_epochs: ${hyperparameters.epochs}
  accelerator: auto
  devices: 1
  precision: "16-mixed"

# ── Datasets ───────────────────────────────────────────────────────────────
# Replace input_csv_path and root_dir with your actual data paths.
# The CSV must have columns: image_path, mask_path (relative to root_dir).
train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.dataset.SegmentationDataset
  input_csv_path: /data/train.csv
  root_dir: /data
  augmentation_list:
    - _target_: albumentations.Resize
      height: ${backbone.input_height}
      width:  ${backbone.input_width}
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: true
    pin_memory: true
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.dataset.SegmentationDataset
  input_csv_path: /data/val.csv
  root_dir: /data
  augmentation_list:
    - _target_: albumentations.Resize
      height: ${backbone.input_height}
      width:  ${backbone.input_width}
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: false
    pin_memory: true
    drop_last: false

# ── Metrics ────────────────────────────────────────────────────────────────
metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: ${hyperparameters.classes}
  - _target_: torchmetrics.F1Score
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro
