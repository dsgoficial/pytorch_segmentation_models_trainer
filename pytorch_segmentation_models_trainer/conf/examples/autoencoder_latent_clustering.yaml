# ──────────────────────────────────────────────────────────────────────────────
# Example: Autoencoder latent clustering metrics
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - _self_

hyperparameters:
  model_name: autoencoder_latent_clustering
  batch_size: 16
  epochs: 20
  max_lr: 1e-4
  in_channels: 3

pl_model:
  _target_: pytorch_segmentation_models_trainer.model_loader.autoencoder_model.AutoencoderModel

model:
  _target_: pytorch_segmentation_models_trainer.custom_models.generic_autoencoder.GenericAutoencoder
  encoder_name: resnet18
  use_huggingface: false
  in_channels: ${hyperparameters.in_channels}
  latent_dim: 128
  pretrained: true

loss:
  _target_: torch.nn.MSELoss

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.max_lr}
  weight_decay: 1e-4

scheduler_list:
  - scheduler:
      _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      T_max: ${hyperparameters.epochs}
    interval: epoch
    frequency: 1

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.image_dataset.AutoencoderDataset
  input_csv_path: /data/images.csv
  root_dir: /data
  augmentation_list:
    - _target_: albumentations.Resize
      height: 256
      width: 256
    - _target_: albumentations.Normalize
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.image_dataset.AutoencoderDataset
  input_csv_path: /data/val_images.csv
  root_dir: /data
  augmentation_list:
    - _target_: albumentations.Resize
      height: 256
      width: 256
    - _target_: albumentations.Normalize
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: false

pl_trainer:
  max_epochs: ${hyperparameters.epochs}
  accelerator: auto
  devices: 1

callbacks:
  - _target_: pytorch_segmentation_models_trainer.custom_callbacks.AutoencoderLatentClusteringCallback
    n_clusters: 8
    max_samples: 2048
    kmeans_max_iter: 50
    kmeans_batch_size: 1024
    random_state: 42
    normalize: true
    latent_reduction: adaptive_avg_pool
    compute_silhouette: true
    compute_dunn: false
    label_key: null
    latent_source: auto
    image_key: image
