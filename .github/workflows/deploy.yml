name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'website/**'
      - 'scripts/generate_schema.py'
      - 'pytorch_segmentation_models_trainer/**/*.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Etapa 1: Python → gera schema.json ──────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.11

      - name: Install Python dependencies for schema generation
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install segmentation-models-pytorch albumentations torchmetrics pydantic-settings

      - name: Generate schema.json
        run: uv run scripts/generate_schema.py

      # ── Etapa 2: Node.js → build Config Builder (React/Vite) ────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Config Builder dependencies
        run: npm ci
        working-directory: web

      - name: Build Config Builder
        run: npm run build
        working-directory: web
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # ── Etapa 3: Node.js → build Docusaurus ─────────────────────────────────
      - name: Install Docusaurus dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      # ── Etapa 4: Combinar artefatos ──────────────────────────────────────────
      # Docs em /  →  website/build/
      # Config Builder em /config-builder/  →  website/build/config-builder/
      - name: Copy Config Builder into Docusaurus build
        run: cp -r web/dist/ website/build/config-builder/

      # ── Etapa 5: Deploy para GitHub Pages ───────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
