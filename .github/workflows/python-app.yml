# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main, dev* ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
        HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - uses: satackey/action-docker-layer-caching@v0.0.11
      # Ignore the failure of a step and avoid terminating the job.
      continue-on-error: true
    - uses: huaxk/postgis-action@v1
      with:
        postgresql version: 'latest'
        postgresql password: 'postgres'
        postgresql user: 'postgres'  # This optional environment variable is used in conjunction with postgresql password to set a user and its password. This variable will create the specified user with superuser power and a database with the same name. If it is not specified, then the default user of 'postgres' will be used.
        postgresql db: 'test_db'  # This optional environment variable can be used to define a different name for the default database that is created when the image is first started. If it is not specified, then the value of postgresql user will be used.
    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "::set-output name=dir::$(pip cache dir)"
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest parameterized coverage pytest-timeout
        if [ -f requirements.txt ]; then pip install --upgrade --upgrade-strategy eager -r requirements.txt; fi
        pip install .
        pip uninstall opencv-python opencv-python-headless -y || true
        pip install opencv-python-headless
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Cache downloaded models
      uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cache
        key: ${{ runner.os }}-cache
    - name: Cache downloaded models2
      uses: actions/cache@v4
      id: cache2
      with:
        path: ~/work/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/custom_models/pretrained/
        key: ${{ runner.os }}-cache2
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in $(seq 1 30); do
          pg_isready -h localhost -p 5432 -U postgres && echo "PostgreSQL is ready" && break
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Cache test checkpoints
      uses: actions/cache@v4
      id: test-cache
      with:
        path: ~/work/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/tests/testing_data/data/checkpoints/
        key: ${{ runner.os }}-test-cache
    - name: Test with pytest (fast tests)
      run: |
        coverage run --source pytorch_segmentation_models_trainer --omit pytorch_segmentation_models_trainer/custom_models/sync_bn/* \
          -m pytest tests/ \
          --ignore=tests/test_detection_model.py \
          --ignore=tests/test_gradient_centralization.py \
          --ignore=tests/test_optimizers.py \
          --ignore=tests/test_custom_models.py \
          --ignore=tests/test_frame_field_model.py \
          --timeout=120 \
          -v \
          -p no:warnings
    - name: Test memory-intensive models (isolated)
      run: |
        for f in tests/test_detection_model.py tests/test_gradient_centralization.py tests/test_optimizers.py tests/test_custom_models.py tests/test_frame_field_model.py; do
          echo "=== Running $f in isolation ==="
          coverage run --source pytorch_segmentation_models_trainer --omit pytorch_segmentation_models_trainer/custom_models/sync_bn/* \
            --append -m pytest "$f" --timeout=300 -v -p no:warnings || true
        done
    - name: statistics
      if: success()
      run: |
        coverage report
        coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      # see: https://github.com/actions/toolkit/issues/399
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: cpu,unittest,python${{ matrix.python-version }}
        name: CPU-coverage
        fail_ci_if_error: false

  # ── Transformer / foundation-model test suite ──────────────────────────────
  # Runs the 7 new test files that cover ModelOutputAdapter, HuggingFace
  # wrappers, timm decoder, TerraTorch wrapper, LoRA fine-tuning, hardened
  # training loop, and the updated inference pipeline.
  #
  # Install the optional extras with:
  #   pip install pytorch_segmentation_models_trainer[transformers]
  # ──────────────────────────────────────────────────────────────────────────
  test-transformers:
    runs-on: ubuntu-latest
    env:
      HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Get pip cache dir
      id: pip-cache
      run: echo "::set-output name=dir::$(pip cache dir)"

    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-transformers-${{ hashFiles('**/requirements.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-transformers-
          ${{ runner.os }}-pip-

    # CPU-only PyTorch keeps the image small and the job fast.
    - name: Install PyTorch (CPU)
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    # Install the package with the [transformers] extras group.
    # This brings in: transformers, peft, timm (+ all base requirements).
    - name: Install package with transformer extras
      run: |
        pip install flake8 pytest coverage pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ".[transformers]"
        # OpenCV headless to avoid GUI deps on the runner
        pip uninstall opencv-python opencv-python-headless -y || true
        pip install opencv-python-headless

    - name: Lint new files with flake8
      run: |
        flake8 \
          pytorch_segmentation_models_trainer/custom_models/transformer_adapters.py \
          pytorch_segmentation_models_trainer/custom_models/huggingface_models.py \
          pytorch_segmentation_models_trainer/custom_models/timm_models.py \
          pytorch_segmentation_models_trainer/custom_models/terratorch_models.py \
          pytorch_segmentation_models_trainer/fine_tuning/ \
          pytorch_segmentation_models_trainer/config_definitions/fine_tuning_config.py \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 \
          pytorch_segmentation_models_trainer/custom_models/transformer_adapters.py \
          pytorch_segmentation_models_trainer/custom_models/huggingface_models.py \
          pytorch_segmentation_models_trainer/custom_models/timm_models.py \
          pytorch_segmentation_models_trainer/custom_models/terratorch_models.py \
          pytorch_segmentation_models_trainer/fine_tuning/ \
          pytorch_segmentation_models_trainer/config_definitions/fine_tuning_config.py \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run transformer test suite
      run: |
        coverage run \
          --source pytorch_segmentation_models_trainer \
          --omit pytorch_segmentation_models_trainer/custom_models/sync_bn/* \
          -m pytest \
            tests/test_transformer_adapters.py \
            tests/test_huggingface_models.py \
            tests/test_timm_models.py \
            tests/test_fine_tuning.py \
            tests/test_model_training_step.py \
            tests/test_terratorch_models.py \
            tests/test_inference_pipeline.py \
          --timeout=120 \
          -v \
          -p no:warnings

    - name: Coverage report
      if: success()
      run: |
        coverage report
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: cpu,transformers,unittest
        name: CPU-transformers-coverage
        fail_ci_if_error: false
