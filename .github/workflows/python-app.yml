# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main, dev* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
        HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - uses: satackey/action-docker-layer-caching@v0.0.11
      # Ignore the failure of a step and avoid terminating the job.
      continue-on-error: true
    - uses: huaxk/postgis-action@v1
      with:
        postgresql version: 'latest'
        postgresql password: 'postgres'
        postgresql user: 'postgres'
        postgresql db: 'test_db'

    - name: Install dependencies
      run: |
        uv sync --frozen --extra all --dev
        uv pip install opencv-python-headless

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Cache downloaded models
      uses: actions/cache@v6
      id: cache
      with:
        path: ~/.cache
        key: ${{ runner.os }}-cache
    - name: Cache downloaded models2
      uses: actions/cache@v6
      id: cache2
      with:
        path: ~/work/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/custom_models/pretrained/
        key: ${{ runner.os }}-cache2
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in $(seq 1 30); do
          pg_isready -h localhost -p 5432 -U postgres && echo "PostgreSQL is ready" && break
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Cache test checkpoints
      uses: actions/cache@v6
      id: test-cache
      with:
        path: ~/work/pytorch_segmentation_models_trainer/pytorch_segmentation_models_trainer/tests/testing_data/data/checkpoints/
        key: ${{ runner.os }}-test-cache
    - name: Test with pytest (parallel)
      run: |
        uv run pytest tests/ \
          -n auto --dist loadfile \
          --cov=pytorch_segmentation_models_trainer \
          --cov-report=xml \
          --ignore=tests/test_detection_model.py \
          --ignore=tests/test_gradient_centralization.py \
          --ignore=tests/test_optimizers.py \
          --ignore=tests/test_custom_models.py \
          --ignore=tests/test_frame_field_model.py \
          --ignore=tests/test_gee_downloader.py \
          --timeout=120 \
          -v \
          -p no:warnings
    - name: Test memory-intensive models (isolated)
      run: |
        for f in tests/test_detection_model.py tests/test_gradient_centralization.py tests/test_optimizers.py tests/test_custom_models.py tests/test_frame_field_model.py; do
          echo "=== Running $f in isolation ==="
          uv run pytest "$f" \
            --cov=pytorch_segmentation_models_trainer --cov-append --cov-report=xml \
            --timeout=300 -v -p no:warnings || true
        done
    - name: statistics
      if: success()
      run: |
        uv run coverage report
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: success()
      # see: https://github.com/actions/toolkit/issues/399
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: main
        name: main-coverage
        fail_ci_if_error: false

  # ── Transformer / foundation-model test suite ──────────────────────────────
  # Runs the 7 new test files that cover ModelOutputAdapter, HuggingFace
  # wrappers, timm decoder, TerraTorch wrapper, LoRA fine-tuning, hardened
  # training loop, and the updated inference pipeline.
  #
  # Install the optional extras with:
  #   uv sync --extra transformers
  # ──────────────────────────────────────────────────────────────────────────
  test-transformers:
    runs-on: ubuntu-latest
    env:
      HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    # CPU-only PyTorch keeps the image small and the job fast.
    - name: Install dependencies (CPU)
      run: |
        uv venv
        uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        uv sync --frozen --extra all --dev
        uv pip install opencv-python-headless

    - name: Lint new files with flake8
      run: |
        uv run flake8 \
          pytorch_segmentation_models_trainer/custom_models/transformer_adapters.py \
          pytorch_segmentation_models_trainer/custom_models/huggingface_models.py \
          pytorch_segmentation_models_trainer/custom_models/timm_models.py \
          pytorch_segmentation_models_trainer/custom_models/terratorch_models.py \
          pytorch_segmentation_models_trainer/fine_tuning/ \
          pytorch_segmentation_models_trainer/config_definitions/fine_tuning_config.py \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 \
          pytorch_segmentation_models_trainer/custom_models/transformer_adapters.py \
          pytorch_segmentation_models_trainer/custom_models/huggingface_models.py \
          pytorch_segmentation_models_trainer/custom_models/timm_models.py \
          pytorch_segmentation_models_trainer/custom_models/terratorch_models.py \
          pytorch_segmentation_models_trainer/fine_tuning/ \
          pytorch_segmentation_models_trainer/config_definitions/fine_tuning_config.py \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run transformer test suite
      run: |
        uv run pytest \
          -n auto --dist loadfile \
          --cov=pytorch_segmentation_models_trainer \
          --cov-report=xml \
          tests/test_transformer_adapters.py \
          tests/test_huggingface_models.py \
          tests/test_timm_models.py \
          tests/test_fine_tuning.py \
          tests/test_model_training_step.py \
          tests/test_terratorch_models.py \
          tests/test_inference_pipeline.py \
          --timeout=120 \
          -v \
          -p no:warnings

    - name: Coverage report
      if: success()
      run: |
        uv run coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: success()
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: transformers
        name: transformers-coverage
        fail_ci_if_error: false

  # ── GEE LULC downloader test suite ────────────────────────────────────────
  # Covers tools/gee/gee_downloader.py (MapBiomas, Dynamic World, ESRI LULC).
  # All GEE API calls are mocked — no GEE account or network access required.
  #
  # Install the optional extra with:
  #   pip install pytorch_segmentation_models_trainer[gee]
  # ──────────────────────────────────────────────────────────────────────────
  test-gee:
    runs-on: ubuntu-latest
    env:
      HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv venv
        uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        uv sync --frozen --extra tests --extra gee --dev

    - name: Lint GEE files with flake8
      run: |
        uv run flake8 \
          pytorch_segmentation_models_trainer/tools/gee/ \
          tests/test_gee_downloader.py \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 \
          pytorch_segmentation_models_trainer/tools/gee/ \
          tests/test_gee_downloader.py \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run GEE test suite
      run: |
        uv run pytest \
          tests/test_gee_downloader.py \
          --cov=pytorch_segmentation_models_trainer \
          --cov-report=xml \
          --timeout=60 \
          -v \
          -p no:warnings

    - name: Coverage report
      if: success()
      run: |
        uv run coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: success()
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: gee
        name: gee-coverage
        fail_ci_if_error: false

  # ── GPU-accelerated classic ML test suite ─────────────────────────────────
  # Runs the 5 test files that cover tensor_conversion, feature_engineering,
  # estimators, postprocessing, and orchestrator from the classic_ml module.
  #
  # All GPU dependencies (cupy, cucim, cuml, pydensecrf, pygco) are mocked via
  # patch.dict(sys.modules, ...) so the job runs on a CPU-only runner without
  # any CUDA packages installed.
  # ──────────────────────────────────────────────────────────────────────────
  test-gpu-ml:
    runs-on: ubuntu-latest
    env:
      HYDRA_FULL_ERROR: 1

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python 3.12
      run: uv python install 3.12

    # CPU-only PyTorch keeps the image small; gpu-ml extras (cupy, cuml, cucim)
    # are intentionally excluded because they require CUDA and are fully mocked
    # in the test suite.
    - name: Install dependencies (CPU, no gpu-ml extras)
      run: |
        uv venv
        uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        uv sync --frozen --extra tests --dev
        uv pip install opencv-python-headless

    - name: Lint new files with flake8
      run: |
        uv run flake8 \
          pytorch_segmentation_models_trainer/classic_ml/ \
          pytorch_segmentation_models_trainer/utils/tensor_conversion.py \
          pytorch_segmentation_models_trainer/config_definitions/classic_ml_config.py \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 \
          pytorch_segmentation_models_trainer/classic_ml/ \
          pytorch_segmentation_models_trainer/utils/tensor_conversion.py \
          pytorch_segmentation_models_trainer/config_definitions/classic_ml_config.py \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run gpu-ml test suite
      run: |
        uv run pytest \
          -n auto --dist loadfile \
          --cov=pytorch_segmentation_models_trainer \
          --cov-report=xml \
          tests/test_tensor_conversion.py \
          tests/test_classic_ml_feature_engineering.py \
          tests/test_classic_ml_estimators.py \
          tests/test_classic_ml_postprocessing.py \
          tests/test_classic_ml_orchestrator.py \
          --timeout=120 \
          -v \
          -p no:warnings

    - name: Coverage report
      if: success()
      run: |
        uv run coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: success()
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.xml
        flags: gpu-ml
        name: gpu-ml-coverage
        fail_ci_if_error: false
