# Codecov configuration
codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: [70, 100]
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 0%

flags:
  main:
    paths:
      - pytorch_segmentation_models_trainer/
    carryforward: true
  transformers:
    paths:
      - pytorch_segmentation_models_trainer/
    carryforward: true
  gpu-ml:
    paths:
      - pytorch_segmentation_models_trainer/
    carryforward: true

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "**/tests/**"
  - "**/__init__.py"
