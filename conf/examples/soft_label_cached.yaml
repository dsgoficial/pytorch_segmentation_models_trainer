#   image_key: image_path
#   mask_key: mask_path
#   lulc_keys: [mapbiomas_path, esri_path, dw_path]
#   border_radius: 10
#   patch_size: [256, 256]
#   patch_stride: [256, 256]     # use [128, 128] for 50% overlap
#   augmentation_list:
#     - _target_: albumentations.HorizontalFlip
#       p: 0.5
#     - _target_: albumentations.Normalize
#       mean: [0.485, 0.456, 0.406]
#       std: [0.229, 0.224, 0.225]
#     - _target_: albumentations.pytorch.ToTensorV2
#   data_loader:
#     batch_size: 8
#     num_workers: 8
#     shuffle: true
#     pin_memory: true
#     drop_last: true

loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.soft_label_loss.SoftLabelWeightedCELoss
  name: soft_label_ce
  num_classes: ${hyperparameters.num_classes}
  mask_key: mask
  weight_key: w_conf

model:
  _target_: segmentation_models_pytorch.Unet
  encoder_name: resnet50
  encoder_weights: imagenet
  in_channels: 3
  classes: ${hyperparameters.num_classes}

class_definitions:
  names: [background, building, road, vegetation, water, forest]

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.learning_rate}
  weight_decay: 1.0e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${hyperparameters.num_epochs}

metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: ${hyperparameters.num_classes}
    average: macro
