# Soft-label training WITHOUT the border-distance component — original paper formula.
# This replicates the W_conf formula from Xiao et al. (2026, JSTARS) exactly,
# using only entropy-based weighting (and optionally AEF embeddings).
#
# W_conf = alpha * w_entropy              (no AEF)
# W_conf = (alpha * w_entropy + beta * w_embed) / (alpha + beta)   (with AEF)
#
# NOTE: the border-distance component (w_border) is a contribution of this
# framework that is NOT present in the original paper.  Use --no-border when
# you want to replicate the original results without that contribution.
#
# Generate soft labels without border:
#   pytorch-smt-tools build-soft-labels sources.csv \
#       --output-dir /data/soft_labels_no_border \
#       --num-classes 4 \
#       --alpha 0.6 \
#       --no-border
#
# Then generate splits:
#   pytorch-smt-tools generate-training-csv \
#       /data/soft_labels_no_border/soft_label_manifest.csv \
#       --output-dir /data/splits_no_border
#
# CSV columns required:
#   image_path  - path to RGB GeoTIFF (3 bands, uint8)
#   p_soft_path - path to P_soft GeoTIFF (C bands, float32)
#   w_conf_path - path to W_conf GeoTIFF (1 band, float32, no border component)

_target_: pytorch_segmentation_models_trainer.model_loader.soft_label_model.SoftLabelModel

hyperparameters:
  num_epochs: 50
  batch_size: 16
  learning_rate: 1.0e-4

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits_no_border/train.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: true
    pin_memory: true
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits_no_border/val.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  augmentation_list:
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: false
    pin_memory: true
    drop_last: false

loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.soft_label_loss.SoftLabelWeightedCELoss
  name: soft_label_ce
  num_classes: 4
  mask_key: mask
  weight_key: w_conf

model:
  _target_: segmentation_models_pytorch.Unet
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 3
  classes: 4

class_definitions:
  names: [background, building, road, vegetation]

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.learning_rate}
  weight_decay: 1.0e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${hyperparameters.num_epochs}

metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: 4
    average: macro
