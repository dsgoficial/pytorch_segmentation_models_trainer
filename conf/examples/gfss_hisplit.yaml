# HiSplit: split a base class (mother) among its children over the frozen
# base model; classes outside the hierarchy keep the base predictions
# (hierarchical decoding).
defaults:
  - gfss_base_only
  - _self_

experiments_runner:
  output_base_dir: outputs/gfss/hisplit_proto_pampa

gfss:
  method:
    _target_: pytorch_segmentation_models_trainer.few_shot.methods.hisplit.HiSplit
    q: proto                 # proto | proto_prob | linear | trans | edl
    tau: 10.0                # cosine temperature (proto, init of linear/trans)
    variance: shared         # proto_prob: shared | per_class
    decoding: hierarchical   # hierarchical | flat
    # trans only:
    trans_weights: [1.0, 1.0, 1.0]   # CE support, entropy, KL(q̄||π) in the superclass
    adapt_iter: 50
    lr: 1.0e-3
    pi_update_at: [10]
    # edl only: steps to reach full weight of the EDL KL regulariser
    kl_anneal_steps: 50
    # boundary of the superclass (P2)
    leak: false              # learned leak from other classes into the novel child (needs max_steps > 0)
    leak_init: -4.0
    widen: none              # none | prob | dissonance (evidential base)
    widen_threshold: 0.3
    novel_prior_weight: 1.0
    sweep: []                # e.g. [0.1, 0.2, 0.3, 0.4] with widen: prob -> test/var/widen_<t>/...

pl_trainer:
  max_steps: 0               # q: linear/trans/edl -> e.g. 100 (optimizer node)
  inference_mode: true       # false for q: trans

# Evidential base (R2 trained with EvidentialWrapper): replace `model` with the
# wrapper as in its training config; HiSplit splits the Dirichlet evidence and
# logs base_vacuity / dissonance in test/unc/...
# model:
#   _target_: pytorch_segmentation_models_trainer.custom_models.edl_wrapper.EvidentialWrapper
#   model:
#     _target_: segmentation_models_pytorch.UPerNet
#     encoder_name: resnet50
#     encoder_weights: null
#     classes: 5
