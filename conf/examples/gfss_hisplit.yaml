# HiSplit: split a base class (mother) among its children over the frozen
# base model; classes outside the hierarchy keep the base predictions
# (hierarchical decoding).
defaults:
  - gfss_base_only
  - _self_

experiments_runner:
  output_base_dir: outputs/gfss/hisplit_proto_pampa

gfss:
  # q: linear_aef_gate only -- named external-embedding sources, keyed to
  # match the method's own aux_names (HiSplit's AEF gate wants "aef").
  # null/{} (default) disables it; required by any method with a
  # non-empty aux_names. A value can be a bare directory string (per-tile
  # <id>.npz AlphaEarth Foundations embeddings, key 'aef', (n_bands, h, w)
  # int8, -128 = nodata) or a Hydra target with a load_batch(mask_paths,
  # device, size) matching AefCacheLoader's -- e.g. OlmoEarth v1.3
  # embeddings (few_shot/olmoearth_cache.py) instead of AlphaEarth
  # Foundations.
  # aux_cache_loaders:
  #   aef: /path/to/aef_cache
  #   # or, for an alternative loader:
  #   # aef:
  #   #   _target_: pytorch_segmentation_models_trainer.few_shot.olmoearth_cache.OlmoEarthCacheLoader
  #   #   cache_dir: /path/to/olmoearth_cache
  #   #   n_bands: 64
  #   # or, to fuse 2+ products into ONE gate (early fusion -- aef_dim
  #   # below must then equal the sum of the sub-loaders' own n_bands;
  #   # compare against GateEnsemble's late fusion, 2 separate gates
  #   # averaged after their own q):
  #   # aef:
  #   #   _target_: pytorch_segmentation_models_trainer.few_shot.concat_aux_loader.ConcatAuxLoader
  #   #   loaders:
  #   #     - /path/to/aef_cache
  #   #     - _target_: pytorch_segmentation_models_trainer.few_shot.olmoearth_cache.OlmoEarthCacheLoader
  #   #       cache_dir: /path/to/olmoearth_cache
  #   #       n_bands: 128
  method:
    _target_: pytorch_segmentation_models_trainer.few_shot.methods.hisplit.HiSplit
    # q: a bare string ("proto" | "proto_prob" | "linear" | "trans" | "edl" |
    # "logreg" | "linear_aef_gate") picks the strategy with its defaults; a
    # nested Hydra target overrides its own (lean, q-specific) params, e.g.:
    #   q:
    #     _target_: pytorch_segmentation_models_trainer.few_shot.methods.q_strategies.ProtoProbStrategy
    #     variance: shared          # shared | per_class
    #   q:
    #     _target_: pytorch_segmentation_models_trainer.few_shot.methods.q_strategies.TransStrategy
    #     trans_weights: [1.0, 1.0, 1.0]  # CE support, entropy, KL(q̄||π) in the superclass
    #     adapt_iter: 50
    #     lr: 1.0e-3
    #     pi_update_at: [10]
    #     pseudo_label_weight: 0.0            # weight of the CE of q against the pseudo-label
    #     pseudo_label_contrast_weight: 0.0   # weight of the hinge repulsion between kept/novel pseudo-labelled features
    #     pseudo_label_contrast_margin: 0.0   # margin of that hinge, relu(cos - margin)
    #     pseudo_label_threshold: 0.3         # confidence threshold tau (split entropy)
    #     pseudo_label_threshold_start: null  # set (< pseudo_label_threshold) for a confidence curriculum
    #     pseudo_label_start_iter: 0          # first adapt_to_query iteration where these terms apply
    #     pseudo_label_min_pixels: 1          # min confident pixels per side (kept/novel) for the contrast term
    #     pseudo_label_teacher_period: 0      # periodic-snapshot teacher; 0 = live q is its own teacher
    #     tversky_weight: 0.0         # weight of (1 - mean_c Tversky_c) added to the loss
    #     tversky_alpha: 0.5          # false-positive weight
    #     tversky_beta: 0.5           # false-negative weight; > alpha favours recall on under-predicted children
    #   q:
    #     _target_: pytorch_segmentation_models_trainer.few_shot.methods.q_strategies.EDLStrategy
    #     kl_anneal_steps: 50   # steps to reach full weight of the EDL KL regulariser
    #   q:
    #     _target_: pytorch_segmentation_models_trainer.few_shot.methods.q_strategies.LinearAefGateStrategy
    #     aef_gate_epochs: 200  # Adam steps of the self-contained fit
    #     aef_gate_lr: 1.0e-2
    q: proto
    tau: 10.0                # cosine temperature (proto, init of linear/trans)
    decoding: hierarchical   # hierarchical | flat
    # boundary of the superclass (P2)
    leak: false              # learned leak from other classes into the novel child (needs max_steps > 0)
    leak_init: -4.0
    widen: none              # none | prob | dissonance (evidential base)
    widen_threshold: 0.3
    novel_prior_weight: 1.0
    sweep: []                # e.g. [0.1, 0.2, 0.3, 0.4] with widen: prob -> test/var/widen_<t>/...
    # uncertainty-gated abstention: forces the novel children to -inf where the
    # chosen uncertainty map exceeds the threshold, falling back to the mother's
    # kept child. Measure must be one of test/unc/... below (null disables it).
    abstain_measure: null     # e.g. split_entropy | split_vacuity (q: edl) | dissonance (evidential base)
    abstain_threshold: 0.3
    # continuous alternative to abstain_measure: blends q towards the kept
    # child by (1 - measure(x)) everywhere, instead of an all-or-nothing
    # threshold; works with decoding: flat too. null disables it.
    confidence_weight_measure: null  # e.g. split_entropy | split_vacuity (q: edl) | dissonance (evidential base)
    # transform applied to the measure before blending: clamp(scale * measure**power, 0, 1).
    # 1.0/1.0 = no-op. Use power=2.0 (optionally with scale) to compress a measure whose
    # typical range is mid-scale (e.g. dissonance, mean ~0.4 on a real checkpoint) instead
    # of near an endpoint, so the blend weight doesn't pull too hard towards the kept child.
    confidence_weight_power: 1.0
    confidence_weight_scale: 1.0
    # reweights q's own training loss (q: linear/trans/edl) per pixel by
    # (1 - measure(x)): pixels where the base model's own evidence is weak
    # count less towards training q. Independent of confidence_weight_measure
    # above (that one reweights the decoded split at inference, not training).
    support_loss_weight_measure: null  # e.g. split_vacuity (q: edl) | base_vacuity | dissonance (evidential base)
    # any q: snaps q to a hard one-hot (BCM-style override) wherever the named
    # uncertainty measure is below the threshold (confident); keeps the usual
    # soft q elsewhere. null disables it (default).
    hard_decode_measure: null    # e.g. split_entropy | split_vacuity (q: edl) | dissonance (evidential base)
    hard_decode_threshold: 0.3
    # q: trans only -- fits a LogisticRegressionCV teacher on the support
    # (same classifier as hisplit_logreg/BCM) and distils its decision into q
    # via a confidence-weighted CE on the query. 0.0 = disabled (default).
    bcm_teacher_weight: 0.0
    # q: linear_aef_gate only -- modulates the base features by
    # sigmoid(Linear(aux)) before the linear head, with an external per-pixel
    # embedding (e.g. AlphaEarth Foundations) at the base's own feature grid;
    # the gate + head are fit together by a self-contained Adam loop inside
    # init_from_support (like logreg's sklearn fit), not pl_trainer's loop.
    # Needs gfss.aux_cache_loaders.aef set above AND train_dataset/test_dataset.
    # return_metadata: true (the method reads each tile's mask_path to find
    # its cached embedding).
    aef_dim: 64               # channel count of the external embedding
    # q: linear_aef_gate only -- concatenates the frozen base model's own
    # base_vacuity to the AEF embedding before the gate's Linear (input dim
    # becomes aef_dim + 1). Requires base_output: evidential below (the
    # R2-EDL model override at the end of this file). false = disabled
    # (default, aef_dim-only gate as above).
    aef_gate_uncertainty: false
    # q: linear_aef_gate only -- alternative to aef_gate_uncertainty above
    # (not its composition): blends the gate's OUTPUT deterministically
    # towards 1 (no modulation) by 1 - base_vacuity, instead of giving it
    # to the gate's Linear as an input. No new learned parameters. Also
    # requires base_output: evidential.
    aef_gate_uncertainty_blend: false
    # Aplica o gate junto de q: linear/trans/edl (nao so' q: linear_aef_gate)
    # -- treinado pelo loop generico de q (pl_trainer.max_steps > 0), nao
    # pelo self-fit. false = desligado (default). Ex.: q: edl acima +
    # aef_gate: true combina o ganho do q=edl com o gate AEF, nunca testado
    # antes porque os dois eram valores mutuamente exclusivos de q.
    aef_gate: false

pl_trainer:
  max_steps: 0               # q: linear/trans/edl -> e.g. 100 (optimizer node)
  inference_mode: true       # false for q: trans

# Evidential base (R2 trained with EvidentialWrapper): replace `model` with the
# wrapper as in its training config; HiSplit splits the Dirichlet evidence and
# logs base_vacuity / dissonance in test/unc/...
# model:
#   _target_: pytorch_segmentation_models_trainer.custom_models.edl_wrapper.EvidentialWrapper
#   model:
#     _target_: segmentation_models_pytorch.UPerNet
#     encoder_name: resnet50
#     encoder_weights: null
#     classes: 5
