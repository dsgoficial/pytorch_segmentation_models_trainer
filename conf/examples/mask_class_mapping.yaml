# On-the-fly mask class remapping for windowed segmentation datasets.
# Masks on disk keep 6 classes (0..5); training sees 5 classes because
# class 5 is merged into class 3 when each mask window is read.
train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.dataset.CSVWindowedSegmentationDataset
  input_csv_path: /data/train_windows.csv
  image_key: image
  mask_key: mask
  row_off_key: row_off
  col_off_key: col_off
  patch_size_key: patch_size
  n_classes: 5
  mask_class_mapping:
    5: 3     # merge class 5 into class 3
    # 4: 255 # (alternative) send class 4 to the ignore index
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    shuffle: true
    num_workers: 4
    pin_memory: true
    drop_last: true
    batch_size: ${hyperparameters.batch_size}
