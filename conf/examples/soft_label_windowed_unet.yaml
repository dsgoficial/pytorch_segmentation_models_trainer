# Soft-label training with patch-level windowed reading — Experiment E5.
# Uses SoftLabelWindowedDataset: patches are read on-the-fly from full-scene
# rasters using rasterio.windows.Window — no pre-cut patch files required.
#
# Prerequisites — generate patch manifest with:
#   pytorch-smt-tools build-soft-labels sources.csv \
#       --output-dir /data/soft_labels \
#       --num-classes 4 \
#       --alpha 0.6 \
#       --patch-size 512 \
#       --stride 256
#
# This produces: /data/soft_labels/soft_label_patches.csv
# with columns: tile_id, image_path, p_soft_path, w_conf_path,
#               row_off, col_off, patch_size
#
# Then split into train/val/test:
#   pytorch-smt-tools generate-training-csv \
#       /data/soft_labels/soft_label_patches.csv \
#       --output-dir /data/splits

_target_: pytorch_segmentation_models_trainer.model_loader.soft_label_model.SoftLabelModel

hyperparameters:
  num_epochs: 50
  batch_size: 8      # lower than tile-based due to larger patch size
  learning_rate: 5.0e-5
  patch_size: 512

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_windowed_dataset.SoftLabelWindowedDataset
  input_csv_path: /data/splits/train.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  row_off_key: row_off
  col_off_key: col_off
  patch_size_key: patch_size
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: true
    pin_memory: true
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_windowed_dataset.SoftLabelWindowedDataset
  input_csv_path: /data/splits/val.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  row_off_key: row_off
  col_off_key: col_off
  patch_size_key: patch_size
  augmentation_list:
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: false
    pin_memory: true
    drop_last: false

loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.soft_label_loss.SoftLabelWeightedCELoss
  name: soft_label_ce
  num_classes: 4
  mask_key: mask
  weight_key: w_conf

model:
  _target_: segmentation_models_pytorch.Unet
  encoder_name: efficientnet-b4
  encoder_weights: imagenet
  in_channels: 3
  classes: 4

class_definitions:
  names: [background, building, road, vegetation]

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.learning_rate}
  weight_decay: 1.0e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${hyperparameters.num_epochs}

metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: 4
    average: macro
