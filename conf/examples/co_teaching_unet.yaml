# Co-teaching training with curriculum-guided noise-aware weak supervision.
# Reference: Xiao et al. (2026, JSTARS) — eq. 8-11.
_target_: pytorch_segmentation_models_trainer.model_loader.co_teaching_model.CoTeachingModel

hyperparameters:
  num_epochs: 100
  batch_size: 16
  learning_rate: 1.0e-4

# Curriculum scheduler — overrides CoTeachingLoss defaults
curriculum:
  e_warm: 20       # warm-up epochs
  p_start: 0.5     # initial retention fraction
  p_end: 0.95      # final retention fraction

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits/train.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits/val.csv
  image_key: image_path
  p_soft_key: p_soft_path
  w_conf_key: w_conf_path
  augmentation_list:
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: false

loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.co_teaching_loss.CoTeachingLoss
  name: co_teaching
  num_classes: 4
  e_warm: 20
  p_start: 0.5
  p_end: 0.95
  lambda_reg: 0.1   # weight for neighbourhood regularization (0 to disable)

model:
  _target_: segmentation_models_pytorch.Unet
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 3
  classes: 4

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.learning_rate}
  weight_decay: 1.0e-4

class_definitions:
  names: [background, building, road, vegetation]
