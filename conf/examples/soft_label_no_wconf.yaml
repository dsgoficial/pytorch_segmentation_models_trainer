# Soft-label training WITHOUT confidence weighting — Experiment E1.
# Uses only P_soft (class probability maps) as supervision.
# Equivalent to the original paper's baseline that replaces hard labels
# with soft distributions but applies no per-pixel loss down-weighting.
#
# To add confidence weighting (E2), add w_conf_key: w_conf_path to each
# dataset block and switch to conf/examples/soft_label_unet.yaml.
#
# CSV columns required:
#   image_path  - path to RGB GeoTIFF (3 bands, uint8)
#   p_soft_path - path to P_soft GeoTIFF (C bands, float32, sums to 1 per pixel)

_target_: pytorch_segmentation_models_trainer.model_loader.soft_label_model.SoftLabelModel

hyperparameters:
  num_epochs: 50
  batch_size: 16
  learning_rate: 1.0e-4

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits/train.csv
  image_key: image_path
  p_soft_key: p_soft_path
  # w_conf_key intentionally omitted → unweighted soft cross-entropy (E1)
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 8
    shuffle: true
    pin_memory: true
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.soft_label_dataset.SoftLabelDataset
  input_csv_path: /data/splits/val.csv
  image_key: image_path
  p_soft_key: p_soft_path
  augmentation_list:
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    batch_size: ${hyperparameters.batch_size}
    num_workers: 4
    shuffle: false
    pin_memory: true
    drop_last: false

loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.soft_label_loss.SoftLabelWeightedCELoss
  name: soft_label_ce
  num_classes: 4
  mask_key: mask
  # weight_key omitted → all pixels weighted equally

model:
  _target_: segmentation_models_pytorch.Unet
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 3
  classes: 4

class_definitions:
  names: [background, building, road, vegetation]

optimizer:
  _target_: torch.optim.AdamW
  lr: ${hyperparameters.learning_rate}
  weight_decay: 1.0e-4

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${hyperparameters.num_epochs}

metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: 4
    average: macro
