# Fixed support draws for generalized few-shot segmentation (GFSS).
# Run:  pytorch-smt --config-dir conf/examples --config-name build_fewshot_episodes
# Output: one row per selected window (original window-index columns +
# shots, draw, novel_class, novel_fraction). Supports are nested per draw
# (K=1 ⊂ K=3 ⊂ ...), the same for every method.
mode: build-fewshot-episodes
fewshot_episodes:
  window_index_cache: /data/tiles_data/train_pampa.csv   # pool (training split)
  mask_base_path: /data/masks                           # prefix of relative mask paths
  novel_classes: [5]               # mask values of the novel classes
  shots: [1, 3, 5, 10]             # support sizes K (windows per novel class)
  n_draws: 5                       # independent draws per K
  min_novel_fraction: 0.05         # eligibility: class covers >= 5% of valid pixels
  seed: 2026
  ignore_index: 255
  output_csv: outputs/episodes/pampa.csv
