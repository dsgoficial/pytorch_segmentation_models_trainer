# MBTiles Crops Dataset — segmentation training from pre-selected crop windows
#
# MBTilesCropsGeoTifMaskDataset: images from MBTile, windows from CSV or vector
# file, masks from any rasterio-readable source (VRT / GeoTIFF / MBTile).
#
# Two usage variants are shown below.

# ---------------------------------------------------------------------------
# Variant A: CSV pixel-space windows + VRT mask (mosaics multiple GeoTIFFs)
# ---------------------------------------------------------------------------
# The CSV must have at least two columns: row_off and col_off (pixel offsets
# relative to the image raster).  All patches will be patch_size × patch_size.
# The VRT file can be generated with:
#   gdalbuildvrt mask.vrt /data/masks/*.tif
# ---------------------------------------------------------------------------

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.mbtiles_crops_dataset.MBTilesCropsGeoTifMaskDataset
  image_mbtiles_path: /data/imagery.mbtiles
  mask_path: /data/masks/mask.vrt          # VRT mosaicking all GeoTIFF masks
  crops_path: /data/crops/windows.csv      # row_off, col_off columns
  patch_size: 256
  # Multi-band RGB mask: map colours to class indices
  color_map:
    - [255, 0, 0, 1]   # red   → building
    - [0, 255, 0, 2]   # green → vegetation
    - [0, 0, 255, 3]   # blue  → water
  image_dtype: uint8
  image_resampling: bilinear
  return_metadata: false
  window_index_cache: /data/cache/train_windows.csv
  augmentation_list:
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomRotate90
      p: 0.5
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    shuffle: true
    num_workers: 8
    pin_memory: true
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.mbtiles_crops_dataset.MBTilesCropsGeoTifMaskDataset
  image_mbtiles_path: /data/imagery.mbtiles
  mask_path: /data/masks/mask.vrt
  crops_path: /data/crops/val_windows.csv
  patch_size: 256
  color_map:
    - [255, 0, 0, 1]
    - [0, 255, 0, 2]
    - [0, 0, 255, 3]
  augmentation_list:
    - _target_: albumentations.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    shuffle: false
    num_workers: 4
    pin_memory: true
    drop_last: false

# ---------------------------------------------------------------------------
# Variant B: vector file windows + single-band GeoTIFF mask
# ---------------------------------------------------------------------------
# Each feature in the GeoPackage defines one training window.  The feature
# bounding-box centre is projected to image pixel space and a
# patch_size × patch_size window is centred on it (bbox-snap).
# Single-band masks are used directly as class indices; n_classes=2 binarises
# all non-zero values to foreground class 1.
# ---------------------------------------------------------------------------

